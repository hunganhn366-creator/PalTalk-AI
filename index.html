<script>
const SUPABASE_URL = "https://qomncbeywccnxzgkbhmc.supabase.co";
const SUPABASE_KEY = "sb_publishable_rf_iZgd54OQ8_klQlCAvRg_xD-3NgZG";
const SITE_URL = "https://hunganhn366-creator.github.io/PalTalk-AI/";

// Initialize Supabase with explicit session persistence options for static hosting
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: {
    persistSession: true,
    autoRefreshToken: true,
    detectSessionInUrl: true
  }
});

const $ = id => document.getElementById(id);
let currentUser = null;

async function initSession() {
  const { data: { session }, error } = await db.auth.getSession();
  if (error) console.error("Session error:", error.message);
  
  currentUser = session ? session.user : null;
  updateUI();
  if (currentUser) {
    loadChatHistory();
  }
}

function updateUI() {
  if (currentUser) {
    $("signInBtn").classList.add("hidden");
    $("signOutBtn").classList.remove("hidden");
    $("userAvatar").classList.remove("hidden");
    
    const meta = currentUser.user_metadata || {};
    const name = meta.full_name || meta.name || currentUser.email;
    const avatar = meta.avatar_url || "https://www.gravatar.com/avatar/?d=mp";
    
    $("userName").textContent = name;
    $("userAvatar").src = avatar;
  } else {
    $("signInBtn").classList.remove("hidden");
    $("signOutBtn").classList.add("hidden");
    $("userAvatar").classList.add("hidden");
    $("userName").textContent = "Not signed in";
  }
}

$("signInBtn").addEventListener("click", async () => {
  const { error } = await db.auth.signInWithOAuth({
    provider: "google",
    options: { redirectTo: SITE_URL }
  });
  if (error) alert("Sign in error: " + error.message);
});

$("signOutBtn").addEventListener("click", async () => {
  await db.auth.signOut();
  currentUser = null;
  updateUI();
  $("chatBox").innerHTML = '<div class="message assistant">Hello! I am your AI English Mentor. Sign in to save your conversation history!</div>';
});

async function loadChatHistory() {
  const { data, error } = await db
    .from("chat_history")
    .select("*")
    .eq("user_id", currentUser.id)
    .order("created_at", { ascending: true });

  if (!error && data && data.length > 0) {
    $("chatBox").innerHTML = "";
    data.forEach(msg => appendMessage(msg.content, msg.role));
  }
}

$("chatForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = $("userInput").value.trim();
  if (!text) return;

  if (!currentUser) {
    alert("Please sign in with Google to chat with your AI mentor!");
    return;
  }

  appendMessage(text, "user");
  $("userInput").value = "";

  await db.from("chat_history").insert({
    user_id: currentUser.id,
    role: "user",
    content: text
  });

  setTimeout(async () => {
    let reply = "That's a good attempt! To sound more natural, try focusing on your verb tenses and article usage here.";
    const lower = text.toLowerCase();
    
    if (lower.includes("hello") || lower.includes("hi")) {
      reply = "Hi there! What English topic would you like to practice today? Grammar, vocabulary, or conversation?";
    } else if (lower.includes("grammar")) {
      reply = "Grammar can be tricky! Tell me the specific sentence you are unsure about, and I will explain the rule step-by-step.";
    } else if (lower.includes("vocab") || lower.includes("word")) {
      reply = "Building vocabulary is great. Let's pick a word and use it in 3 different example sentences!";
    }

    appendMessage(reply, "assistant");

    await db.from("chat_history").insert({
      user_id: currentUser.id,
      role: "assistant",
      content: reply
    });
  }, 700);
});

function appendMessage(text, sender) {
  const div = document.createElement("div");
  div.className = "message " + sender;
  div.textContent = text;
  $("chatBox").appendChild(div);
  $("chatBox").scrollTop = $("chatBox").scrollHeight;
}

db.auth.onAuthStateChange((event, session) => {
  currentUser = session ? session.user : null;
  updateUI();
  if (currentUser) {
    loadChatHistory();
  }
});

initSession();
</script>
